  <title>Thank you | Outbound Partner</title>

  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0e10;color:#f5f7ef;font-family:'DM Sans',sans-serif}main{width:min(620px,100%);padding:clamp(30px,7vw,64px);border:1px solid #ffffff20;border-radius:24px;background:radial-gradient(ellipse at 90% 0,#d5ff6310,transparent 50%),#12181b;box-shadow:0 30px 90px #0005}.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.14em;color:#d5ff63;text-transform:uppercase}.mark{width:48px;height:48px;display:grid;place-items:center;border-radius:14px 14px 14px 4px;background:#d5ff63;color:#0b0e10;font-size:27px;margin-bottom:28px}h1{font:600 clamp(40px,8vw,64px)/1 'Space Grotesk',sans-serif;letter-spacing:-.07em;margin:18px 0}h1 em{font-style:normal;color:#d5ff63}p{color:#a8b3ad;line-height:1.85;font-size:14px;max-width:480px;margin-bottom:30px}.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 20px;border-radius:100px;background:#d5ff63;color:#11160c;text-decoration:none;font-size:12px;font-weight:700;transition:transform .25s,box-shadow .25s}.btn:hover{transform:translateY(-3px);box-shadow:0 14px 32px #d5ff6327}
  </style>
</head>
<body><main><div class="mark">↗</div><div class="eyebrow">INQUIRY RECEIVED</div><h1>Thanks for <em>reaching out.</em></h1><p>Your message has been submitted. I’ll review your agency details and get back to you if the inquiry reaches my inbox. If this is your first time using the form, the owner must activate delivery from the confirmation email.</p><a class="btn" href="https://hafizhamzayaqoob004-ctrl.github.io/Portfolio/">Back to the portfolio ↗</a></main></body>
</html>
